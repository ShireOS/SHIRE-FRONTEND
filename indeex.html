<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shire | Command Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-void: #0a0a0c;
            --bg-surface: #141416;
            --s-clean: #2c2c2e;
            --s-reserved: #8e44ad;
            --s-occupied: #0A84FF;
            --s-dirty: #FF453A;
            --s-clean-text: #8e8e93;
            --txt-primary: #FFFFFF;
            --txt-secondary: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            font-family: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-void);
            color: var(--txt-primary);
            height: 100vh;
            display: grid;
            grid-template-columns: 320px 1fr;
            grid-template-rows: 60px 1fr 80px;
            overflow: hidden;
        }

        .app-header {
            grid-column: 1 / -1;
            grid-row: 1 / 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(10, 10, 12, 0.8);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .sidebar {
            grid-column: 1 / 2;
            grid-row: 2 / -1;
            background: var(--bg-surface);
            border-right: 1px solid var(--glass-border);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            z-index: 50;
        }

        .map-stage {
            grid-column: 2 / -1;
            grid-row: 2 / -1;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #16161a 0%, #0a0a0c 100%);
            background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .brand-logo {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .section-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--txt-secondary);
            margin-bottom: 12px;
            letter-spacing: 0.05em;
            display: flex;
            justify-content: space-between;
        }

        .res-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
        }

        .res-card:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .res-card.active {
            border-color: var(--s-occupied);
            background: rgba(10, 132, 255, 0.1);
        }

        .res-time {
            font-size: 13px;
            font-weight: 600;
            color: var(--s-occupied);
        }

        .res-name {
            font-size: 14px;
            font-weight: 500;
            margin: 4px 0 2px;
        }

        .res-detail {
            font-size: 12px;
            color: var(--txt-secondary);
        }

        .table-entity {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: center;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .table-entity:hover {
            transform: scale(1.05);
            z-index: 10;
        }

        .table-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* Table Shapes */
        .shape-core {
            fill: var(--s-clean);
            stroke: rgba(255, 255, 255, 0.1);
            stroke-width: 2;
            transition: all 0.3s;
        }

        .chair {
            fill: #2c2c2e;
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 1;
            transition: fill 0.3s;
        }

        .table-text {
            fill: var(--s-clean-text);
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 700;
            text-anchor: middle;
            dominant-baseline: central;
            user-select: none;
        }

        /* State Colors */
        .state-occupied .shape-core {
            fill: var(--s-occupied);
            stroke: rgba(255, 255, 255, 0.2);
        }

        .state-occupied .table-text {
            fill: #fff;
        }

        .state-occupied .chair {
            fill: rgba(10, 132, 255, 0.3);
        }

        .state-reserved .shape-core {
            fill: var(--s-reserved);
            stroke: rgba(255, 255, 255, 0.2);
        }

        .state-reserved .table-text {
            fill: #fff;
        }

        .state-reserved .chair {
            fill: rgba(142, 68, 173, 0.3);
        }

        .state-dirty .shape-core {
            fill: rgba(255, 69, 58, 0.15);
            stroke: var(--s-dirty);
            stroke-dasharray: 4 4;
        }

        .state-dirty .table-text {
            fill: var(--s-dirty);
        }

        /* Waiter & Info */
        .info-tag {
            position: absolute;
            top: -20px;
            right: -10px;
            background: #fff;
            color: #000;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(5px);
            transition: 0.2s;
            pointer-events: none;
            white-space: nowrap;
        }

        .table-entity:hover .info-tag {
            opacity: 1;
            transform: translateY(0);
        }

        .waiter-dot {
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            background: #222;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 9px;
            font-weight: 600;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .action-dock {
            grid-column: 2 / -1;
            grid-row: 3 / -1;
            align-self: end;
            justify-self: center;
            margin-bottom: 24px;
            background: rgba(20, 20, 22, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            display: flex;
            align-items: center;
            padding: 8px 8px 8px 32px;
            gap: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        .dock-stats {
            display: flex;
            gap: 32px;
        }

        .stat-unit {
            display: flex;
            flex-direction: column;
        }

        .stat-val {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }

        .stat-lbl {
            font-size: 10px;
            font-weight: 600;
            color: var(--txt-secondary);
            text-transform: uppercase;
            margin-top: 2px;
        }

        .btn-seat {
            background: #fff;
            color: #000;
            border: none;
            padding: 0 32px;
            height: 48px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.15);
        }

        .btn-seat:hover {
            background: #f0f0f0;
            transform: scale(1.02);
        }

        .btn-seat:active {
            transform: scale(0.98);
        }

        .section-title {
            position: absolute;
            font-size: 28px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.06);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            pointer-events: none;
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <header class="app-header">
        <div class="brand-logo">SHIRE <span style="font-weight:400;color:var(--txt-secondary)">| Floor Plan</span></div>
        <div style="font-size: 14px; font-weight:500; font-variant-numeric: tabular-nums;">FRI 12:45 PM</div>
    </header>
    <aside class="sidebar">
        <div>
            <div class="section-label"><span>Waitlist</span><span>3 Parties</span></div>
            <div class="res-card active">
                <div class="res-time">Waiting 15m</div>
                <div class="res-name">Cameron K.</div>
                <div class="res-detail">6 Guests • Priority</div>
            </div>
            <div class="res-card">
                <div class="res-time">Waiting 5m</div>
                <div class="res-name">Miller</div>
                <div class="res-detail">2 Guests</div>
            </div>
        </div>
        <div>
            <div class="section-label"><span>Upcoming Reservations</span></div>
            <div class="res-card">
                <div class="res-time">1:00 PM</div>
                <div class="res-name">Tech Corp Dinner</div>
                <div class="res-detail">8 Guests • VIP</div>
            </div>
            <div class="res-card">
                <div class="res-time">1:30 PM</div>
                <div class="res-name">Sarah Jenkins</div>
                <div class="res-detail">4 Guests</div>
            </div>
        </div>
    </aside>
    <main class="map-stage" id="floorCanvas">
        <div class="section-title" style="top: 8%; left: 8%;">Main Dining</div>
        <div class="section-title" style="top: 8%; right: 12%;">Bar Area</div>
        <div class="section-title" style="bottom: 15%; left: 8%;">Patio</div>
    </main>
    <div class="action-dock">
        <div class="dock-stats">
            <div class="stat-unit"><span class="stat-val">82%</span><span class="stat-lbl">Capacity</span></div>
            <div class="stat-unit"><span class="stat-val">12m</span><span class="stat-lbl">Avg Wait</span></div>
            <div class="stat-unit"><span class="stat-val" style="color:#32D74B;">+15%</span><span class="stat-lbl">Turn
                    Rate</span></div>
        </div>
        <button class="btn-seat">Seat Cameron (6)</button>
    </div>

    <script>
        const canvas = document.getElementById('floorCanvas');

        // Table Data Config
        // x, y are percentages. w, h are base sizes in pixels
        const tables = [
            // --- MAIN DINING (Top Left) ---
            { id: 11, x: 15, y: 22, type: 'rect', w: 100, h: 60, seats: 4, state: 'clean' },
            { id: 12, x: 28, y: 22, type: 'rect', w: 100, h: 60, seats: 4, state: 'occupied', time: '1h 10m', waiter: 'JD' },
            { id: 13, x: 41, y: 22, type: 'rect', w: 100, h: 60, seats: 4, state: 'clean' },
            { id: 14, x: 54, y: 22, type: 'rect', w: 100, h: 60, seats: 4, state: 'dirty', time: 'Needs Bussing' },

            // --- MAIN DINING BOOTHS (Left Wall) ---
            { id: 21, x: 8, y: 45, type: 'booth-left', w: 70, h: 80, seats: 4, state: 'occupied', time: '45m', waiter: 'MK' },
            { id: 22, x: 8, y: 62, type: 'booth-left', w: 70, h: 80, seats: 4, state: 'reserved', time: '1:00 PM' },
            { id: 23, x: 8, y: 79, type: 'booth-left', w: 70, h: 80, seats: 4, state: 'clean' },

            // --- CENTER ROUNDS ---
            { id: 31, x: 30, y: 55, type: 'circle', w: 110, h: 110, seats: 6, state: 'clean' },
            { id: 32, x: 48, y: 55, type: 'circle', w: 110, h: 110, seats: 6, state: 'occupied', time: '20m', waiter: 'AS' },

            // --- BAR AREA (Right Side) ---
            { id: 41, x: 70, y: 20, type: 'circle', w: 55, h: 55, seats: 2, state: 'clean' },
            { id: 42, x: 82, y: 20, type: 'circle', w: 55, h: 55, seats: 2, state: 'occupied', time: '10m', waiter: 'JD' },
            { id: 43, x: 70, y: 35, type: 'circle', w: 55, h: 55, seats: 2, state: 'clean' },
            { id: 44, x: 82, y: 35, type: 'circle', w: 55, h: 55, seats: 2, state: 'clean' },

            // Bar Counter (Large Rect)
            { id: "BAR", x: 76, y: 65, type: 'rect-vertical', w: 50, h: 220, seats: 8, state: 'occupied', time: 'Active', label: 'BAR' },
            { id: 45, x: 92, y: 60, type: 'booth-right', w: 60, h: 70, seats: 4, state: 'clean' },
            { id: 46, x: 92, y: 78, type: 'booth-right', w: 60, h: 70, seats: 4, state: 'occupied', time: '1h 05m', waiter: 'JD' },

            // --- PATIO (Bottom Left) ---
            { id: 51, x: 25, y: 85, type: 'diamond', w: 60, h: 60, seats: 4, state: 'clean' },
            { id: 52, x: 38, y: 85, type: 'diamond', w: 60, h: 60, seats: 4, state: 'occupied', time: '15m', waiter: 'MK' },
            { id: 53, x: 51, y: 85, type: 'diamond', w: 60, h: 60, seats: 4, state: 'clean' }
        ];

        function createSVGElement(tag) {
            return document.createElementNS('http://www.w3.org/2000/svg', tag);
        }

        // Draw chairs dynamically around a shape
        function getChairs(type, w, h, seats) {
            let chairs = [];
            const chairSize = 14;
            const offset = chairSize / 2 + 6;

            if (type === 'rect' || type === 'booth-left' || type === 'booth-right') {
                const topBottomSeats = Math.ceil(seats / 2);
                for (let i = 0; i < topBottomSeats; i++) {
                    let cx = (w / (topBottomSeats + 1)) * (i + 1);
                    if (type === 'rect') {
                        chairs.push({ cx, cy: -offset, r: chairSize / 2 });
                        chairs.push({ cx, cy: h + offset, r: chairSize / 2 });
                    }
                }
                if (type === 'booth-left') {
                    for (let i = 1; i <= 2; i++) chairs.push({ cx: w + offset, cy: (h / 3) * i, r: chairSize / 2 });
                }
                if (type === 'booth-right') {
                    for (let i = 1; i <= 2; i++) chairs.push({ cx: -offset, cy: (h / 3) * i, r: chairSize / 2 });
                }
            } else if (type === 'circle' && w === h) {
                const radius = w / 2 + offset;
                const angleStep = (Math.PI * 2) / seats;
                for (let i = 0; i < seats; i++) {
                    chairs.push({
                        cx: w / 2 + Math.cos(i * angleStep) * radius,
                        cy: h / 2 + Math.sin(i * angleStep) * radius,
                        r: chairSize / 2
                    });
                }
            } else if (type === 'rect-vertical') {
                for (let i = 1; i <= seats; i++) {
                    chairs.push({ cx: -offset, cy: (h / (seats + 1)) * i, r: chairSize / 2 });
                }
            } else if (type === 'diamond') {
                chairs.push({ cx: w / 2, cy: -offset, r: chairSize / 2 });
                chairs.push({ cx: w / 2, cy: h + offset, r: chairSize / 2 });
                chairs.push({ cx: -offset, cy: h / 2, r: chairSize / 2 });
                chairs.push({ cx: w + offset, cy: h / 2, r: chairSize / 2 });
            }

            return chairs;
        }

        function renderMap() {
            tables.forEach(t => {
                const el = document.createElement('div');
                el.className = `table-entity state-${t.state}`;
                el.style.left = `calc(${t.x}% - ${t.w / 2}px)`;
                el.style.top = `calc(${t.y}% - ${t.h / 2}px)`;
                el.style.width = t.w + 'px';
                el.style.height = t.h + 'px';

                // Create SVG Layer
                const svg = createSVGElement('svg');
                svg.setAttribute('class', 'table-svg');

                let shape;
                if (t.type === 'circle') {
                    shape = createSVGElement('circle');
                    shape.setAttribute('cx', t.w / 2);
                    shape.setAttribute('cy', t.h / 2);
                    shape.setAttribute('r', t.w / 2);
                } else {
                    shape = createSVGElement('rect');
                    shape.setAttribute('width', t.w);
                    shape.setAttribute('height', t.h);

                    if (t.type === 'rect' || t.type === 'rect-vertical' || t.type === 'diamond') {
                        shape.setAttribute('rx', 8);
                    } else if (t.type === 'booth-left') {
                        shape.setAttribute('rx', 16);
                        shape.setAttribute('qx', 4); // Aesthetic placeholder for complex rect
                    } else if (t.type === 'booth-right') {
                        shape.setAttribute('rx', 16);
                    }

                    if (t.type === 'diamond') {
                        svg.style.transform = "rotate(45deg)";
                    }
                }
                shape.setAttribute('class', 'shape-core');
                svg.appendChild(shape);

                // Add Chairs (Dynamic SVG Circles)
                const chairs = getChairs(t.type, t.w, t.h, t.seats);
                chairs.forEach(c => {
                    const chair = createSVGElement('circle');
                    chair.setAttribute('cx', c.cx);
                    chair.setAttribute('cy', c.cy);
                    chair.setAttribute('r', c.r);
                    chair.setAttribute('class', 'chair');
                    svg.appendChild(chair);
                });

                // Add Text Label
                const text = createSVGElement('text');
                text.setAttribute('x', t.w / 2);
                text.setAttribute('y', t.h / 2);
                text.setAttribute('class', 'table-text');
                if (t.type === 'diamond') {
                    text.setAttribute('transform', `rotate(-45 ${t.w / 2} ${t.h / 2})`);
                }
                text.textContent = t.label || t.id;
                svg.appendChild(text);
                el.appendChild(svg);

                // Add HTML Info Badges Overlay
                if (t.time || t.seats) {
                    const info = document.createElement('div');
                    info.className = 'info-tag';
                    info.innerText = t.state === 'clean' ? `${t.seats} Seats` : (t.time || t.state);
                    el.appendChild(info);
                }

                if (t.waiter) {
                    const wBadge = document.createElement('div');
                    wBadge.className = 'waiter-dot';
                    wBadge.innerText = t.waiter;
                    el.appendChild(wBadge);
                }

                canvas.appendChild(el);
            });
        }

        renderMap();
    </script>
</body>

</html>
